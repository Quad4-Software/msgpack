# Mutation testing with gremlins. Manual or monthly: mutation runs are slow.
name: Mutation

on:
  workflow_dispatch:
  schedule:
    - cron: "51 4 1 * *"

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOWORK: "off"
  CI_GO_VERSION: "1.27.1"
  CI_GREMLINS_VERSION: "v0.6.0"

jobs:
  gremlins:
    name: gremlins
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: msgpack
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout msgpack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: msgpack
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.CI_GO_VERSION }}
          cache-dependency-path: |
            msgpack/go.mod
            msgpack/go.sum
            pbt/go.mod
            tagparser/go.mod

      - name: Install gremlins
        working-directory: ${{ github.workspace }}
        env:
          GREMLINS_VERSION: ${{ env.CI_GREMLINS_VERSION }}
        run: go install "github.com/go-gremlins/gremlins/cmd/gremlins@${GREMLINS_VERSION}"

      - name: Run mutation testing
        run: gremlins unleash --output gremlins-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gremlins-report
          path: msgpack/gremlins-report.json
          if-no-files-found: ignore
          retention-days: 30
