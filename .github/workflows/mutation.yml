# Mutation testing with gremlins. Manual or monthly: mutation runs are slow.
name: Mutation

on:
  workflow_dispatch:
  schedule:
    - cron: "51 4 1 * *"

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOWORK: "off"
  CI_GO_VERSION: "1.27.1"
  CI_GREMLINS_VERSION: "v0.6.0"

jobs:
  gremlins:
    name: gremlins
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: msgpack
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout msgpack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: msgpack
          persist-credentials: false

      - name: Checkout pbt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Quad4-Software/pbt
          path: pbt
          persist-credentials: false

      - name: Checkout tagparser
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Quad4-Software/tagparser
          path: tagparser
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.CI_GO_VERSION }}
          cache-dependency-path: |
            msgpack/go.mod
            msgpack/go.sum
            pbt/go.mod
            tagparser/go.mod

      - name: Install gremlins
        working-directory: ${{ github.workspace }}
        env:
          GREMLINS_VERSION: ${{ env.CI_GREMLINS_VERSION }}
        run: go install "github.com/go-gremlins/gremlins/cmd/gremlins@${GREMLINS_VERSION}"

      - name: Run mutation testing
        run: gremlins unleash --output gremlins-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gremlins-report
          path: msgpack/gremlins-report.json
          if-no-files-found: ignore
          retention-days: 30
