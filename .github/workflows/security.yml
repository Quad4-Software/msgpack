name: Security

on:
  push:
    branches: [v5, master, main]
  pull_request:
    branches: [v5, master, main]
  schedule:
    - cron: "30 12 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOWORK: "off"
  CI_GO_VERSION: "1.27.1"
  CI_GOSEC_VERSION: "v2.27.1"
  CI_GOVULNCHECK_VERSION: "v1.8.0"

jobs:
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: never

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: msgpack
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout msgpack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: msgpack
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.CI_GO_VERSION }}
          cache-dependency-path: |
            msgpack/go.mod
            msgpack/go.sum
            pbt/go.mod
            tagparser/go.mod

      - name: Install gosec
        working-directory: ${{ github.workspace }}
        env:
          GOSEC_VERSION: ${{ env.CI_GOSEC_VERSION }}
        run: sh msgpack/scripts/ci/setup-gosec.sh "$GOSEC_VERSION"

      - name: Run gosec
        run: gosec -exclude-dir=.modcache -exclude-dir=.gocache -exclude-dir=vendor ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: msgpack
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout msgpack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: msgpack
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.CI_GO_VERSION }}
          cache-dependency-path: |
            msgpack/go.mod
            msgpack/go.sum
            pbt/go.mod
            tagparser/go.mod

      - name: Install govulncheck
        working-directory: ${{ github.workspace }}
        env:
          GOVULNCHECK_VERSION: ${{ env.CI_GOVULNCHECK_VERSION }}
        run: sh msgpack/scripts/ci/setup-govulncheck.sh "$GOVULNCHECK_VERSION"

      - name: Run govulncheck
        run: govulncheck ./...

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table
          output: trivy-results.txt

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-fs-report
          path: trivy-results.txt
          if-no-files-found: ignore
          retention-days: 14
